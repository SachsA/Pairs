# Production stack : app Next.js + Postgres + Caddy (HTTPS auto).
# Démarrage : `docker compose up -d` (après avoir rempli .env.production)

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pairs}
      POSTGRES_USER: ${POSTGRES_USER:-pairs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pairs} -d ${POSTGRES_DB:-pairs}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    # Pas de port exposé : seul `app` accède via le réseau interne.

  app:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-pairs}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pairs}?schema=public
      NEXTAUTH_URL: ${NEXTAUTH_URL:?NEXTAUTH_URL requis}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET requis}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL requis}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_placeholder}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-pk_test_placeholder}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_placeholder}
      SITE_LOCK: ${SITE_LOCK:-1}
      SITE_LOCK_PASSWORD: ${SITE_LOCK_PASSWORD:?SITE_LOCK_PASSWORD requis}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Pairs <onboarding@resend.dev>}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - internal
      - web
    # Migrations + seed à chaque démarrage. Idempotent.
    command: >
      sh -c "npx prisma migrate deploy && node server.js"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: "${DOMAIN:?DOMAIN requis - ex pairs.fr}"
      ACME_EMAIL: "${ACME_EMAIL:?ACME_EMAIL requis pour Let's Encrypt}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - web

networks:
  internal:
    driver: bridge
  web:
    driver: bridge

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
